<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f2faf6">
<title>MovAi — My Songs</title>
<style>
  /* MovAi new — clean look, one single pale background, no layers. */
  *{box-sizing:border-box}
  html,body{margin:0;padding:0;overflow-x:hidden}
  html{
    background:linear-gradient(180deg,#e8f5f0 0%,#f2faf6 45%,#ffffff 100%);
    background-attachment:fixed;
    -webkit-text-size-adjust:100%;
  }
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
    color:#1f2937;
    background:linear-gradient(180deg,#e8f5f0 0%,#f2faf6 45%,#ffffff 100%);
    background-attachment:fixed;
    min-height:100vh;
  }
  a{color:#1f2937;text-decoration:none}
  button{font:inherit;color:inherit;background:transparent;border:0;padding:0;cursor:pointer}
  img{display:block;max-width:100%}

  .wrap{max-width:720px;margin:0 auto}

  /* ---- Header: two rows, directly on the background (transparent) ---- */
  header{position:sticky;top:0;z-index:20;
    background:linear-gradient(180deg,#e8f5f0 0%,#f2faf6 45%,#ffffff 100%);
    background-attachment:fixed;}
  .hdr-row{display:flex;align-items:center;justify-content:space-between;gap:10px;
    padding-left:16px;padding-right:16px}
  .hdr-top{padding-top:14px;padding-bottom:10px;border-bottom:1px solid #e5e7eb}
  .hdr-sub{padding-top:11px;padding-bottom:11px;border-bottom:1px solid #e5e7eb}
  .hdr-logo{display:flex;align-items:center;gap:8px;color:#1f2937;min-width:0}
  .hdr-logo svg{flex:none}
  .hdr-logo b{font-size:1.3rem;font-weight:800;letter-spacing:-.02em;color:#1f2937;line-height:1}
  .hdr-right{display:flex;align-items:center;gap:4px}
  .icon-btn{font-size:1.35rem;line-height:1;color:#1f2937;padding:4px 9px;border-radius:8px}
  .icon-btn:active{background:#e5e7eb}
  .hdr-sec{display:flex;align-items:center;gap:10px;min-width:0;flex:1}
  .hdr-sec .icon-btn{padding:4px 8px}
  .hdr-sec-name{font-size:1rem;font-weight:600;color:#1f2937;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .hdr-btn{flex:none;font-size:.9rem;font-weight:600;color:#1f2937;
    border:1px solid #d1d5db;border-radius:8px;padding:6px 12px;background:transparent}
  .hdr-btn:active{background:#e5e7eb}

  /* ---- Dropdown menu (plain, no shadow, no card) ---- */
  .menu{position:absolute;left:16px;right:16px;top:100%;z-index:30;
    background:#f2faf6;border:1px solid #e5e7eb;border-radius:10px;
    padding:4px 0;display:none}
  .menu.open{display:block}
  .menu a{display:block;padding:11px 14px;font-size:.95rem;color:#1f2937;border-bottom:1px solid #eef1f0}
  .menu a:last-child{border-bottom:0}
  .menu a:active{background:#e5e7eb}

  /* ---- My Songs: plain list rows directly on the background ---- */
  main{padding-bottom:96px}
  .count{padding:16px 16px 4px;font-size:.95rem;font-weight:600;color:#1f2937}
  .count:empty{display:none}
  .note{padding:2px 16px 0;font-size:.8rem;color:#6b7280}
  .note:empty{display:none}
  .list{animation:fade .3s ease}
  @keyframes fade{from{opacity:0}to{opacity:1}}
  .row{display:flex;align-items:center;gap:12px;width:100%;text-align:left;
    padding:12px 16px;background:transparent;border:0;border-bottom:1px solid #eef1f0;
    cursor:pointer}
  .row:active{background:#eef1f0}
  .thumb{width:56px;height:56px;flex:none;border-radius:8px;object-fit:cover;background:#dfe7e2}
  .row-text{flex:1;min-width:0}
  .row-title{display:block;font-size:.95rem;font-weight:600;color:#1f2937;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .row-sub{display:block;font-size:.8rem;color:#6b7280;margin-top:3px;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .row-dur{flex:none;font-size:.85rem;color:#6b7280}
  .row.playing .row-title{color:#0f766e}
  .status{padding:28px 16px;text-align:center;color:#6b7280;font-size:.95rem}
  .status a{text-decoration:underline}
  .retry{margin-top:10px;color:#1f2937;text-decoration:underline;font-size:.95rem}

  /* ---- Now-playing bar: slim, directly on the background ---- */
  .player{position:fixed;left:0;right:0;bottom:0;z-index:40;
    background:linear-gradient(180deg,#e8f5f0 0%,#f2faf6 45%,#ffffff 100%);
    background-attachment:fixed;
    border-top:1px solid #e5e7eb;
    padding:10px 16px calc(10px + env(safe-area-inset-bottom,0px));}
  .player[hidden]{display:none}
  .player-in{max-width:720px;margin:0 auto;display:flex;align-items:center;gap:12px}
  .player img{width:40px;height:40px;flex:none;border-radius:6px;object-fit:cover;background:#dfe7e2}
  .player-title{flex:1;min-width:0;font-size:.92rem;font-weight:600;color:#1f2937;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .player button{flex:none;font-size:.9rem;font-weight:600;color:#1f2937;
    border:1px solid #d1d5db;border-radius:8px;padding:6px 11px;background:transparent}
  .player button:active{background:#e5e7eb}
  .player .p-close{border:0;font-size:1.05rem;padding:6px 8px}
</style>
</head>
<body>
<div class="wrap">
  <header id="hdr">
    <div class="hdr-row hdr-top">
      <a class="hdr-logo" href="movai-new.html">
        <svg width="26" height="26" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M9 18V5l10-2v11" stroke="#1f2937" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><circle cx="6.5" cy="18" r="2.5" fill="#1f2937"/><circle cx="16.5" cy="16" r="2.5" fill="#1f2937"/></svg>
        <b>MovAi</b>
      </a>
      <span class="hdr-right">
        <button class="icon-btn" id="dotsBtn" type="button" aria-label="Menu" aria-haspopup="true" aria-expanded="false">&#8942;</button>
      </span>
    </div>
    <div class="hdr-row hdr-sub">
      <span class="hdr-sec">
        <button class="icon-btn" id="burgerBtn" type="button" aria-label="Menu" aria-haspopup="true" aria-expanded="false">&#9776;</button>
        <span class="hdr-sec-name">My Songs</span>
      </span>
      <a class="hdr-btn" href="movai-new-create.html">Create Song</a>
    </div>
    <nav class="menu" id="menu" aria-label="Menu">
      <a href="movai-new.html">Home</a>
      <a href="movai-new-create.html">Create Song</a>
      <a href="movai-new-market.html">Marketplace</a>
      <a href="movai-new-songs.html">My Songs</a>
      <a href="movai-new-profile.html">Profile</a>
    </nav>
  </header>

  <main>
    <div class="count" id="count"></div>
    <div class="note" id="note"></div>
    <div class="list" id="list"></div>
    <div class="status" id="status">Loading your songs&hellip;</div>
  </main>
</div>

<div class="player" id="player" hidden>
  <div class="player-in">
    <img id="pCover" alt="" src="">
    <span class="player-title" id="pTitle"></span>
    <button id="pPlay" type="button" aria-label="Play or pause">&#10074;&#10074;</button>
    <button id="pNext" type="button">Next</button>
    <button class="p-close" id="pClose" type="button" aria-label="Close">&#10005;</button>
  </div>
</div>
<audio id="au" preload="none"></audio>

<script>
(function(){
  "use strict";
  var API_BASE = "https://movai-proxy-dphl.onrender.com";
  var COVER_FALLBACK = "data:image/svg+xml;charset=utf-8," + encodeURIComponent(
    '<svg xmlns="http://www.w3.org/2000/svg" width="56" height="56" viewBox="0 0 24 24"><rect width="24" height="24" fill="#dfe7e2"/><path d="M9 18V5l10-2v11" stroke="#1f2937" stroke-width="1.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/><circle cx="6.5" cy="18" r="2.2" fill="#1f2937"/><circle cx="16.5" cy="16" r="2.2" fill="#1f2937"/></svg>');

  var listEl = document.getElementById("list");
  var statusEl = document.getElementById("status");
  var countEl = document.getElementById("count");
  var noteEl = document.getElementById("note");
  var menuEl = document.getElementById("menu");
  var dotsBtn = document.getElementById("dotsBtn");
  var burgerBtn = document.getElementById("burgerBtn");
  var playerEl = document.getElementById("player");
  var pCover = document.getElementById("pCover");
  var pTitle = document.getElementById("pTitle");
  var pPlay = document.getElementById("pPlay");
  var pNext = document.getElementById("pNext");
  var pClose = document.getElementById("pClose");
  var au = document.getElementById("au");

  var songs = [];
  var cur = -1; // index of the song now playing, -1 = none
  var email = "";

  /* ---- login: same session as the other new pages / old site ----
     movai-session in localStorage holds the signed-in email address. */
  function getEmail(){
    try {
      var em = (localStorage.getItem("movai-session") || "").trim();
      if (em && em.indexOf("@") > 0) return em;
    } catch (e) {}
    return "";
  }

  /* ---- helpers ---- */
  function fmtTime(sec){
    if (!isFinite(sec) || sec <= 0) return "–:––";
    sec = Math.floor(sec);
    return Math.floor(sec / 60) + ":" + String(sec % 60).padStart(2, "0");
  }
  function fmtDate(it){
    var d = null;
    if (it && it.createdAt) d = new Date(it.createdAt);
    if ((!d || isNaN(d.getTime())) && it && it.ts) d = new Date(Number(it.ts));
    if (!d || isNaN(d.getTime())) return "";
    return d.toLocaleDateString("en-US", { year: "numeric", month: "short", day: "numeric" });
  }
  // Playback URL: strip fl_attachment (Cloudinary makes it a download link).
  function playUrl(u){
    var s = String(u || "");
    s = s.replace(/,fl_attachment/g, "").replace(/fl_attachment,/g, "");
    s = s.replace(/\/fl_attachment\//g, "/");
    s = s.replace(/([?&])fl_attachment=[^&]*&/g, "$1");
    s = s.replace(/([?&])fl_attachment=[^&]*$/, "");
    return s;
  }
  function songUrl(it){
    if (!it) return "";
    if (typeof it.url === "string" && it.url) return it.url;
    if (typeof it.src === "string" && it.src) return it.src;
    return "";
  }
  function songCover(it){
    if (!it) return "";
    if (typeof it.image === "string" && it.image) return it.image;
    if (typeof it.cover === "string" && it.cover) return it.cover;
    return "";
  }
  function isSongItem(it){
    if (!it || typeof it !== "object") return false;
    var m = String(it.type || it.mode || "").trim().toLowerCase();
    if (m === "image" || m === "video" || m === "3d") return false;
    return !!songUrl(it);
  }

  /* ---- menu ---- */
  function setMenu(open){
    menuEl.classList.toggle("open", !!open);
    dotsBtn.setAttribute("aria-expanded", open ? "true" : "false");
    burgerBtn.setAttribute("aria-expanded", open ? "true" : "false");
  }
  function toggleMenu(){ setMenu(!menuEl.classList.contains("open")); }
  dotsBtn.addEventListener("click", function(e){ e.stopPropagation(); toggleMenu(); });
  burgerBtn.addEventListener("click", function(e){ e.stopPropagation(); toggleMenu(); });
  document.addEventListener("click", function(e){
    if (menuEl.classList.contains("open") && !menuEl.contains(e.target)) setMenu(false);
  });
  document.addEventListener("keydown", function(e){ if (e.key === "Escape") setMenu(false); });
  menuEl.addEventListener("click", function(e){
    if (e.target && e.target.tagName === "A") setMenu(false);
  });

  /* ---- list ---- */
  function setStatus(text){
    statusEl.textContent = text || "";
  }
  function showSignIn(){
    countEl.textContent = "";
    noteEl.textContent = "";
    listEl.innerHTML = "";
    statusEl.innerHTML = "";
    var t = document.createElement("span");
    t.textContent = "Sign in to see your songs. ";
    var a = document.createElement("a");
    a.href = "movai-new-profile.html";
    a.textContent = "Sign in";
    statusEl.appendChild(t);
    statusEl.appendChild(a);
  }
  function showError(){
    countEl.textContent = "";
    noteEl.textContent = "";
    listEl.innerHTML = "";
    statusEl.innerHTML = "";
    var t = document.createElement("div");
    t.textContent = "Could not load your songs — please try again.";
    var b = document.createElement("button");
    b.className = "retry"; b.type = "button"; b.textContent = "Retry";
    b.addEventListener("click", loadSongs);
    statusEl.appendChild(t);
    statusEl.appendChild(b);
  }
  function probeDuration(song, durEl){
    try {
      var a = new Audio();
      a.preload = "metadata";
      a.onloadedmetadata = function(){ durEl.textContent = fmtTime(a.duration); };
      a.onerror = function(){ /* leave the placeholder */ };
      a.src = playUrl(songUrl(song));
      setTimeout(function(){ try { a.src = ""; } catch (e) {} }, 20000);
    } catch (e) { /* leave the placeholder */ }
  }
  function renderList(){
    listEl.innerHTML = "";
    noteEl.textContent = "";
    if (!songs.length) {
      countEl.textContent = "0 songs";
      setStatus("You have no songs yet.");
      return;
    }
    countEl.textContent = songs.length + (songs.length === 1 ? " song" : " songs");
    setStatus("");
    songs.forEach(function(song, i){
      var row = document.createElement("button");
      row.type = "button"; row.className = "row"; row.dataset.i = i;

      var img = document.createElement("img");
      img.className = "thumb"; img.alt = ""; img.loading = "lazy";
      img.src = songCover(song) || COVER_FALLBACK;
      img.onerror = function(){ if (img.src !== COVER_FALLBACK) img.src = COVER_FALLBACK; };

      var text = document.createElement("span");
      text.className = "row-text";
      var title = document.createElement("span");
      title.className = "row-title"; title.textContent = song.title || "Untitled";
      var sub = document.createElement("span");
      sub.className = "row-sub";
      var date = fmtDate(song);
      var model = (typeof song.model === "string" && song.model) ? song.model : "";
      sub.textContent = [date, model].filter(function(x){ return !!x; }).join(" \u2022 ") || "Song";
      text.appendChild(title); text.appendChild(sub);

      var dur = document.createElement("span");
      dur.className = "row-dur";
      var d = Number(song.duration) || 0;
      dur.textContent = d > 0 ? fmtTime(d) : "–:––";

      row.appendChild(img); row.appendChild(text); row.appendChild(dur);
      row.addEventListener("click", function(){ playSong(i); });
      listEl.appendChild(row);
      if (d <= 0) probeDuration(song, dur);
    });
  }
  function loadSongs(){
    email = getEmail();
    if (!email) { showSignIn(); return; }
    setStatus("Loading your songs\u2026");
    listEl.innerHTML = "";
    countEl.textContent = "";
    noteEl.textContent = "";
    // Real history endpoint (server.js): GET /api/public/history?email=
    // returns { ok:true, email, items:[...] } — newest first, max 300.
    // History items: { type:"song", url, title, model, style, image,
    // ts, createdAt, duration, taskId, audioId }.
    fetch(API_BASE + "/api/public/history?email=" + encodeURIComponent(email), { cache: "no-store" })
      .then(function(r){ return r.json(); })
      .then(function(d){
        if (d && d.ok === true && Array.isArray(d.items)) {
          songs = d.items.filter(isSongItem);
          renderList();
          return;
        }
        loadFeedFallback();
      })
      .catch(function(){ loadFeedFallback(); });
  }
  // Fallback: public feed filtered to this user's own posts
  // (GET /api/public/feed returns { ok:true, posts:[...] } with
  // email / mode / title / url / cover / model / createdAt per post).
  function loadFeedFallback(){
    fetch(API_BASE + "/api/public/feed", { cache: "no-store" })
      .then(function(r){ return r.json(); })
      .then(function(d){
        if (!d || d.ok !== true || !Array.isArray(d.posts)) { showError(); return; }
        var mine = d.posts.filter(function(p){
          return p && p.mode === "song" && p.url &&
            typeof p.email === "string" && p.email.toLowerCase() === email.toLowerCase();
        });
        songs = mine;
        renderList();
        if (songs.length) noteEl.textContent = "Showing your public songs only.";
      })
      .catch(function(){ showError(); });
  }

  /* ---- playback ---- */
  function markPlaying(){
    var rows = listEl.querySelectorAll(".row");
    rows.forEach(function(r, i){
      r.classList.toggle("playing", i === cur);
    });
  }
  function syncPlayBtn(){
    pPlay.innerHTML = au.paused ? "&#9654;" : "&#10074;&#10074;";
    pPlay.setAttribute("aria-label", au.paused ? "Play" : "Pause");
  }
  function playSong(i){
    if (i < 0 || i >= songs.length) return;
    cur = i;
    var song = songs[i];
    au.src = playUrl(songUrl(song));
    try { au.currentTime = 0; } catch (e) {}
    pCover.src = songCover(song) || COVER_FALLBACK;
    pCover.onerror = function(){ if (pCover.src !== COVER_FALLBACK) pCover.src = COVER_FALLBACK; };
    pTitle.textContent = song.title || "Untitled";
    playerEl.hidden = false;
    markPlaying();
    au.play().then(function(){ syncPlayBtn(); }).catch(function(){ syncPlayBtn(); });
  }
  function playNext(){
    if (!songs.length) return;
    playSong((cur + 1) % songs.length);
  }
  pPlay.addEventListener("click", function(){
    if (au.paused) { au.play().catch(function(){}); } else { au.pause(); }
    syncPlayBtn();
  });
  pNext.addEventListener("click", playNext);
  pClose.addEventListener("click", function(){
    au.pause(); au.removeAttribute("src"); au.load();
    cur = -1; playerEl.hidden = true; markPlaying();
  });
  au.addEventListener("play", syncPlayBtn);
  au.addEventListener("pause", syncPlayBtn);
  au.addEventListener("ended", function(){
    if (!songs.length) return;
    playSong((cur + 1) % songs.length);
  });

  loadSongs();
})();
</script>
</body>
</html>
